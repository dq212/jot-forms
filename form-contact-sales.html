          tyMsg: 'Someone from our team will be in touch with you shortly.',
          downloadUrl: ''
        };
        window.iFrameResizer = {
          onMessage: function(data) {

              config = Object.assign(config, data.config);
              applyConfig();

        // ============================================================
        // DOMAIN MAP
        // ============================================================
        var domainMap = {
            'teradek.com': { host: 'Teradek', privacy: 'https://teradek.com/pages/privacy-policy', terms: 'https://teradek.com/pages/standard-terms-of-sale' },
            'smallhd.com': { host: 'SmallHD', privacy: 'https://link.cs.inc/shd-priv', terms: 'https://link.cs.inc/shd-terms' },
            'woodencamera.com': { host: 'Wooden Camera', privacy: 'https://woodencamera.com/pages/privacy-policy', terms: 'https://woodencamera.com/pages/standard-terms-of-sale' }
        };

        // ============================================================
        // TURNSTILE — explicit render with readiness flags
        // ============================================================
        var turnstileReady = false;
        var configReady = false;

        function onTurnstileLoad() {
            turnstileReady = true;
            turnstile.render('#turnstile-widget', {
                sitekey: '0x4AAAAAADNX8F30uPsaN81A',
                theme: 'dark',
                size: 'normal',
                execution: 'execute',
                callback: onTurnstileSuccess,
                'error-callback': onTurnstileError,
                'expired-callback': function () {
                    if (window.turnstile) turnstile.reset('#turnstile-widget');
                }
            });
            if (configReady) turnstile.execute('#turnstile-widget');
        }

        function onTurnstileSuccess(token) {
            document.getElementById('input_5').removeAttribute('disabled');
        }

        function onTurnstileError() {
            if (window.turnstile) turnstile.reset('#turnstile-widget');
        }

        // ============================================================
        // APPLY CONFIG
        // ============================================================
        function applyConfig() {
            var site = domainMap[config.domain] || domainMap['teradek.com'];

            var optInLabel = document.querySelector('.label-opt-in-checkbox');
            if (optInLabel) {
                optInLabel.innerHTML = 'Sign me up to receive emails about events, promotions and marketing communications from ' + site.host + '<span class="form-required">*</span>';
            }

            var privacyLabel = document.querySelector('.dynamic-privacy-terms');
            if (privacyLabel) {
                privacyLabel.innerHTML = 'By checking this box you confirm that you have read and agree to our <a href="' + site.terms + '" target="_top">Terms of Service</a> and <a href="' + site.privacy + '" target="_top">Privacy Policy</a>.<span class="form-required">*</span>';
            }

            var sourceField = document.getElementById('input_27');
            if (sourceField) sourceField.value = config.formSource;

            var optInCheckbox = document.querySelector('.opt-in-checkbox');
            var brandCheckboxes = document.querySelectorAll('input[type="checkbox"][name="q7_typeA7[]"][value="' + site.host + '"]');
            if (optInCheckbox) {
                optInCheckbox.addEventListener('change', function () {
                    for (var i = 0; i < brandCheckboxes.length; i++) {
                        brandCheckboxes[i].checked = this.checked;
                    }
                });
            }

            configReady = true;
            if (turnstileReady && window.turnstile) {
                turnstile.execute('#turnstile-widget');
            }
        }

        // ============================================================
        // THANK YOU MESSAGE
        // ============================================================
        function showThankYou() {
            var form = document.getElementById('260426079571359');
            var errorDiv = document.getElementById('customError');
            if (form) form.style.display = 'none';
            if (errorDiv) errorDiv.style.display = 'none';

            var tyHeading = document.getElementById('ty-heading');
            var tyBody = document.getElementById('ty-body');

            if (tyHeading) tyHeading.textContent = config.tyHeading;

            if (tyBody) {
                if (config.isDownload) {
                    tyBody.innerHTML = 'Your download will begin shortly.<br>If it does not start automatically, <a class="text-gray-3" href="' + config.downloadUrl + '" target="_top">click here</a>.';
                    setTimeout(function () {
                        if (config.downloadUrl) window.top.location.href = config.downloadUrl;
                    }, 2000);
                } else {
                    tyBody.textContent = config.tyMsg;
                }
            }

            var tyMsg = document.getElementById('thank-you-msg');
            if (tyMsg) tyMsg.classList.add('visible');
        }

        // ============================================================
        // SUBMISSION DETECTION
        // ============================================================
        window.addEventListener('load', function () {
            var submitTarget = document.getElementById('jotform-submit-target');
            var form = document.getElementById('260426079571359');
            if (!submitTarget || !form) return;

            var formSubmitted = false;

            form.addEventListener('submit', function () {
                formSubmitted = true;
            });

            submitTarget.addEventListener('load', function () {
                if (!formSubmitted) return;
                console.log('[CHILD] hidden iframe loaded after submit — showing thank you');
                setTimeout(showThankYou, 300);
            });
        });

        // JotForm postMessage fallback
        window.addEventListener('message', function (e) {
            if (!e.data || typeof e.data !== 'object') return;
            console.log('[CHILD] message received:', JSON.stringify(e.data).substring(0, 150));

            if (e.data.action === 'submission-completed' || e.data.action === 'thankYou') {
                showThankYou();
            }

            if (e.data.action === 'submission-error') {
                document.getElementById('input_5').removeAttribute('disabled');
                if (window.turnstile) turnstile.reset('#turnstile-widget');
            }
        });

        // ============================================================
        // PRE-SUBMIT VALIDATION
        // ============================================================
        window.addEventListener('load', function () {
            var form = document.getElementById('260426079571359');
            if (!form) return;

            form.onsubmit = function (e) {
                console.log('[CHILD] onsubmit fired');
                var errors = false;
                var requiredFields = ['first_1', 'last_1', 'input_2', 'input_13'];

                for (var i = 0; i < requiredFields.length; i++) {
                    var el = document.getElementById(requiredFields[i]);
                    if (!el) continue;
                    var val = el.value ? el.value.trim() : '';
                    if (!val) {
                        errors = true;
                        el.style.border = '2px solid #d93025';
                        var node = el.parentNode;
                        while (node && node.tagName !== 'LI') node = node.parentNode;
                        if (node) {
                            var cls = node.className || '';
                            if (cls.indexOf('form-line-error') === -1) node.className = cls + ' form-line-error';
                        }
                    } else {
                        el.style.border = '';
                        var node = el.parentNode;
                        while (node && node.tagName !== 'LI') node = node.parentNode;
                        if (node) node.className = (node.className || '').replace(' form-line-error', '').replace('form-line-error', '');
                    }
                }

                var requiredCheckboxes = [
                    document.getElementById('opt-in-checkbox'),
                    document.getElementById('input_64_0')
                ];
                for (var j = 0; j < requiredCheckboxes.length; j++) {
                    var cb = requiredCheckboxes[j];
                    if (!cb) continue;
                    if (!cb.checked) {
                        errors = true;
                        cb.style.border = '2px solid #d93025';
                    } else {
                        cb.style.border = '';
                    }
                }

                if (errors) {
                    console.log('[CHILD] validation failed, blocking submit');
                    var globalError = document.querySelector('.custom-form-error');
                    if (globalError) globalError.className = 'custom-form-error active';
                    document.getElementById('input_5').removeAttribute('disabled');
                    return false;
                }

                console.log('[CHILD] validation passed, calling JotForm submit');
                if (typeof testSubmitFunction !== 'undefined') {
                    return testSubmitFunction();
                }
                return true;
            };

            // Clear field errors on input
            var fields = ['first_1', 'last_1', 'input_2', 'input_13'];
            for (var i = 0; i < fields.length; i++) {
                (function (id) {
                    var el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener('input', function () {
                        if (this.value.trim()) {
                            this.style.border = '';
                            var node = this.parentNode;
                            while (node && node.tagName !== 'LI') node = node.parentNode;
                            if (node) node.className = (node.className || '').replace(' form-line-error', '').replace('form-line-error', '');
                            var hasErrors = document.querySelector('.form-line-error');
                            var globalError = document.querySelector('.custom-form-error');
                            if (globalError) globalError.className = hasErrors ? 'custom-form-error active' : 'custom-form-error';
                        }
                    });
                })(fields[i]);
            }

            var checkboxIds = ['opt-in-checkbox', 'input_64_0'];
            for (var j = 0; j < checkboxIds.length; j++) {
                (function (id) {
                    var cb = document.getElementById(id);
                    if (!cb) return;
                    cb.addEventListener('change', function () {
                        if (this.checked) this.style.border = '';
                        var hasErrors = document.querySelector('.form-line-error');
                        var anyRedBorder = document.querySelector('[style*="border: 2px solid rgb(217, 48, 37)"]');
                        var globalError = document.querySelector('.custom-form-error');
                        if (globalError) globalError.className = (hasErrors || anyRedBorder) ? 'custom-form-error active' : 'custom-form-error';
                    });
                })(checkboxIds[j]);
            }
        });

        // ============================================================
        // ERROR MESSAGING
        // ============================================================
        window.addEventListener('load', function () {
            var errorHolder = document.getElementById('customError');
            if (!errorHolder) return;
            var globalError = document.createElement('div');
            globalError.className = 'custom-form-error';
            globalError.textContent = 'Please correct the errors below:';
            errorHolder.appendChild(globalError);
        });

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('load', function () {
            applyConfig();
        });

    </script>

</body>
