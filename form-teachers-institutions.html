        // Validation passed — flag must be set synchronously before form posts
        formSubmitted = true;

        if (typeof testSubmitFunction !== 'undefined') return testSubmitFunction();
        return true;
      };

      // Clear text field errors on input
      var fields = ['first_1', 'last_1', 'input_2', 'input_21', 'input_22_full'];
      for (var i = 0; i < fields.length; i++) {
        (function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.addEventListener('input', function () {
            if (this.value.trim()) {
              this.style.border = '';
              var node = this.parentNode;
              while (node && node.tagName !== 'LI') node = node.parentNode;
              if (node) node.className = (node.className || '').replace(' form-line-error', '').replace('form-line-error', '');
              var globalError = document.querySelector('.custom-form-error');
              if (globalError && !document.querySelector('.form-line-error') && !document.querySelector('[style*="border: 2px solid rgb(217, 48, 37)"]')) {
                globalError.className = 'custom-form-error';
              }
            }
          });
        })(fields[i]);
      }

      // Clear select errors on change
      var selectIds = ['input_3_country', 'input_24'];
      for (var j = 0; j < selectIds.length; j++) {
        (function (id) {
          var sel = document.getElementById(id);
          if (!sel) return;
          sel.addEventListener('change', function () {
            if (this.value) this.style.border = '';
            var globalError = document.querySelector('.custom-form-error');
            if (globalError && !document.querySelector('.form-line-error') && !document.querySelector('[style*="border: 2px solid rgb(217, 48, 37)"]')) {
              globalError.className = 'custom-form-error';
            }
          });
        })(selectIds[j]);
      }

      // Clear checkbox error on change
      var cb = document.getElementById('input_26_0');
      if (cb) {
        cb.addEventListener('change', function () {
          if (this.checked) this.style.border = '';
          var globalError = document.querySelector('.custom-form-error');
          if (globalError && !document.querySelector('.form-line-error') && !document.querySelector('[style*="border: 2px solid rgb(217, 48, 37)"]')) {
            globalError.className = 'custom-form-error';
          }
        });
      }
    });

    // ============================================================
    // ERROR MESSAGING
    // ============================================================
    window.addEventListener('load', function () {
      var errorHolder = document.getElementById('customError');
      if (!errorHolder) return;
      var globalError = document.createElement('div');
      globalError.className = 'custom-form-error';
      globalError.textContent = 'Please correct the errors below:';
      errorHolder.appendChild(globalError);
    });

    // ============================================================
    // INIT
    // ============================================================
    window.addEventListener('load', function () {
      applyConfig();
    });

  </script>

</body>
